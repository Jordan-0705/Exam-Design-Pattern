spring:
  datasource:
    url: jdbc:h2:mem:badwalletdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  payment:
    service:
      url: http://localhost:8081

server:
  port: 8080